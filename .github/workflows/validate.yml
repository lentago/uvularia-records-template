# ============================================================================
# validate — gate every pull request on the vault's own rules
# ============================================================================
# Runs the vendored core/validate.py and core/evaluate.py against the whole tree
# on every pull request, posts the standing board as a PR comment, and fails the
# check on any validation error. Stdlib only — no pip install.
#
# Deliberately NOT path-filtered. If this is a required status check, a run that
# never triggers is held "Expected" forever and deadlocks every PR that did not
# touch the filtered paths. It is cheap and finishes in seconds.
# ============================================================================

name: validate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write   # to post the standing board as a comment
  checks: read           # telemetry only: which open pull requests are green
  statuses: read         # (the same, for checks that report as commit statuses)

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # the no_delete check needs the base ref present

      - name: Make the base ref available to the no_delete check
        run: git fetch --no-tags origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}" || true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Evaluate obligations into standing.json
        continue-on-error: true   # a failure here must not hide the validator's result
        run: python3 core/evaluate.py . --out standing.json

      - name: Validate the vault
        id: validate
        continue-on-error: true   # captured below so the comment still posts; the job fails at the end
        run: |
          set -o pipefail
          python3 core/validate.py . --base-ref "origin/${{ github.base_ref }}" 2>&1 | tee validate.txt

      - name: Build the PR comment
        if: always()
        run: |
          python3 - <<'PY'
          import json, pathlib
          outcome = "${{ steps.validate.outcome }}"
          lines = ["<!-- uvularia-validate -->", "## Vault checks", ""]
          if outcome == "success":
              lines.append("✅ **All enabled checks passed.** Safe to merge once reviewed.")
          else:
              lines.append("❌ **Validation failed.** Nothing publishes until this is green. See the detail below.")
          try:
              rows = json.loads(pathlib.Path("standing.json").read_text())
          except Exception:
              rows = None
          lines += ["", "### Is it posted?", ""]
          if not rows:
              lines.append("_No standing to show (the evaluator did not produce one)._")
          else:
              mark = {"green": "🟢", "amber": "🟡", "red": "🔴", "no-data": "⚪"}
              lines += ["| | Obligation | State | Satisfied by | Deadline | Gap (days) |",
                        "|---|---|---|---|---|---|"]
              for r in rows:
                  lines.append("| {m} | `{id}` | {state} | {by} | {dl} | {gap} |".format(
                      m=mark.get(r["state"], ""), id=r["id"], state=r["state"],
                      by=(f'`{r["satisfied_by"]}`' if r["satisfied_by"] else "—"),
                      dl=(r["deadline"] or "—"),
                      gap=("—" if r["gap"] is None else r["gap"])))
              lines.append("")
              lines.append("⚪ no-data means there is nothing to show — it is **not** a pass.")
          detail = pathlib.Path("validate.txt").read_text() if pathlib.Path("validate.txt").exists() else ""
          if detail.strip():
              lines += ["", "<details><summary>validate.py output</summary>", "",
                        "```", detail.strip(), "```", "</details>"]
          pathlib.Path("comment.md").write_text("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY
          cat comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post (or update) the standing comment
        if: always()
        continue-on-error: true   # read-only token on a fork PR cannot comment; the step summary still carries it
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('comment.md', 'utf8');
            const marker = '<!-- uvularia-validate -->';
            const {owner, repo} = context.repo;
            const issue_number = context.issue.number;
            const {data: comments} = await github.rest.issues.listComments({owner, repo, issue_number});
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number, body});
            }

      # --- Telemetry (optional; see README "Watch the pipeline") ---------------
      # Describes the review (the validator's outcome, the standing summary, and
      # how many green pull requests are waiting on a person and since when) and
      # pushes it to your own Grafana Cloud Loki when LOKI_PUSH_URL is set.
      # Unset, it prints one "telemetry not configured" line and asks GitHub
      # nothing. No step here can fail the check: a Loki outage is a warning,
      # never a red pull request. This run's own check is still running while it
      # counts, so it says how the check will end (--this-run-conclusion).
      - name: Telemetry — count pull requests waiting on a reviewer
        if: always() && vars.LOKI_PUSH_URL != ''
        continue-on-error: true
        timeout-minutes: 2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          THIS_RUN_CONCLUSION: ${{ steps.validate.outcome == 'success' && job.status == 'success' && 'success' || 'failure' }}
        run: |
          python3 scripts/pipeline_snapshot.py reviewed --out "$RUNNER_TEMP/reviewed-snapshot.json" \
            --this-run "$GITHUB_RUN_ID" --this-run-conclusion "$THIS_RUN_CONCLUSION"

      - name: Telemetry — describe this review
        id: telemetry
        if: always()
        continue-on-error: true
        env:
          LOKI_PUSH_URL: ${{ vars.LOKI_PUSH_URL }}
          LOKI_CLUSTER: ${{ vars.LOKI_CLUSTER }}
          LOKI_TOKEN_SET: ${{ secrets.LOKI_WRITE_TOKEN != '' }}
          JOB_STATUS: ${{ job.status }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 scripts/telemetry.py reviewed --standing standing.json \
            --validate "$VALIDATE_OUTCOME" --pr "$PR_NUMBER" --job-status "$JOB_STATUS" \
            --snapshot "$RUNNER_TEMP/reviewed-snapshot.json"

      - name: Telemetry — push the reviewed event
        if: always() && steps.telemetry.outputs.enabled == 'true'
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.github/actions/loki-event
        with:
          loki_url: ${{ vars.LOKI_PUSH_URL }}
          loki_token: ${{ secrets.LOKI_WRITE_TOKEN }}
          cluster: ${{ steps.telemetry.outputs.cluster }}
          source: uvularia
          pipeline: records
          stage: reviewed
          payload-json: ${{ steps.telemetry.outputs.payload }}

      - name: Fail if validation failed
        if: steps.validate.outcome == 'failure'
        run: |
          echo "validate.py reported problems; see the PR comment and the log above."
          exit 1
